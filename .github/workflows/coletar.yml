# RISCO.sj: coleta alertas oficiais, pluviômetros, nível dos rios e setorização de risco a cada 10 minutos e publica o site.
# Requer, em Settings > Pages, a fonte "GitHub Actions".
name: Coletar dados e publicar

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'dados/historico/**'
      - 'dados/areas-risco.geojson'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: risco-sj-coleta
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar IDAP, INMET, pluviômetros, rios e setorização
        env:
          RISCO_SDC_SITE: ${{ vars.RISCO_SDC_SITE }}
          # Setorização do SGB: 0 desliga, forcar baixa de novo nesta execução (padrão: semanal).
          RISCO_SGB: ${{ vars.RISCO_SGB }}
          # Credenciais do Hidro-WebService da ANA (opcionais). Peça em hidro@ana.gov.br e
          # cadastre em Settings > Secrets and variables > Actions.
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
        run: python coletor/coletar.py --saida dados/alertas.json --historico dados/historico --areas dados/areas-risco.geojson

      - name: Guardar o histórico e a setorização quando mudarem
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/historico
          if [ -f dados/areas-risco.geojson ]; then git add dados/areas-risco.geojson; fi
          if git diff --cached --quiet; then
            echo "Alertas e setorização sem mudança desde a última coleta."
          else
            git commit -m "dados: atualização automática $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push || echo "Push do histórico falhou; a próxima coleta tenta de novo."
          fi

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
