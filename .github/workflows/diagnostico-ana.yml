# Temporário: verifica o coletor contra a ANA real. Roda só em push no branch diagnostico-ana.
name: Diagnóstico ANA
on:
  push:
    branches: [diagnostico-ana]
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sondar o SGB
        run: python coletor/sonda_sgb.py
